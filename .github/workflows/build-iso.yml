# NovaPlay OS – baut das ISO automatisch auf GitHub und lädt es zu SourceForge hoch.
# Startet: manuell (Actions → "ISO bauen" → Run workflow), bei neuen Versions-Tags (v*)
# und einmal im Monat, damit das ISO immer aktuelle Pakete enthält.
name: ISO bauen

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  schedule:
    - cron: '17 3 1 * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
      SF_USER: ${{ secrets.SF_USER }}
      SF_PROJECT: ${{ vars.SF_PROJECT }}
    steps:
      - name: Projekt holen
        uses: actions/checkout@v4

      - name: Speicherplatz freimachen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune -af >/dev/null
          sudo mkdir -p /mnt/work && df -h / /mnt

      - name: GE-Proton herunterladen (wird bei der Installation vorinstalliert)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash profile/airootfs/usr/local/bin/novaplay-fetch-proton-ge download profile/airootfs/usr/share/novaplay/proton-ge

      - name: ISO bauen (im Arch-Linux-Container)
        run: |
          mkdir -p out
          sudo docker run --rm --privileged \
            -v "$PWD/profile:/profile:ro" -v "$PWD/out:/out" -v /mnt/work:/work \
            archlinux:latest \
            bash -c 'pacman -Syu --noconfirm archiso && mkarchiso -v -w /work -o /out /profile'
          sudo chown -R "$USER" out
          ls -lh out

      - name: Prüfsumme erstellen
        id: iso
        run: |
          cd out
          ISO=$(ls *.iso)
          sha256sum "$ISO" > "$ISO.sha256"
          cat "$ISO.sha256"
          echo "name=$ISO" >> "$GITHUB_OUTPUT"
          echo "version=$(echo "$ISO" | sed -E 's/novaplay-(.*)-x86_64.iso/\1/')" >> "$GITHUB_OUTPUT"

      - name: Zu SourceForge hochladen
        if: env.SF_SSH_KEY != '' && env.SF_USER != '' && env.SF_PROJECT != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SF_SSH_KEY" > ~/.ssh/sourceforge
          chmod 600 ~/.ssh/sourceforge
          ssh-keyscan -t ed25519,rsa frs.sourceforge.net >> ~/.ssh/known_hosts 2>/dev/null
          rsync -avP -e "ssh -i $HOME/.ssh/sourceforge" \
            out/*.iso out/*.sha256 \
            "$SF_USER@frs.sourceforge.net:/home/frs/project/$SF_PROJECT/${{ steps.iso.outputs.version }}/"

      - name: GitHub-Release mit Prüfsumme anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.iso.outputs.version }}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] && TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.sha256 --clobber
          else
            gh release create "$TAG" out/*.sha256 \
              --title "NovaPlay OS ${{ steps.iso.outputs.version }}" \
              --notes "Download des ISO: https://sourceforge.net/projects/${SF_PROJECT:-novaplay-os}/files/

          Die Datei \`.sha256\` enthält die Prüfsumme. Prüfen unter Linux: \`sha256sum -c ${{ steps.iso.outputs.name }}.sha256\`

          Siehe CHANGELOG.md für die Neuerungen."
          fi
