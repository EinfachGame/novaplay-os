# NovaPlay OS – Gaming-Optimierungen
# Mehr Speicherbereiche pro Programm (wie bei SteamOS / Fedora). Verhindert Abstürze
# bei manchen großen Spielen (z. B. CS2, Hogwarts Legacy, Star Citizen).
vm.max_map_count = 2147483642
# Keine künstliche Bremse bei "split locks" (bekanntes Ruckeln in manchen Spielen)
kernel.split_lock_mitigate = 0
# Komprimierter Arbeitsspeicher (zram) wird bevorzugt genutzt
vm.swappiness = 100
vm.page-cluster = 0
