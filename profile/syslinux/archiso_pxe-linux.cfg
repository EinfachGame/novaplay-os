LABEL arch_nbd
TEXT HELP
Boot the NovaPlay OS using NBD.
Live-System zum Testen und Installieren.
ENDTEXT
MENU LABEL NovaPlay OS (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G nvidia-drm.modeset=1 archiso_nbd_srv=${pxeserver} cms_verify=y %KERNEL_PARAMS%
SYSAPPEND 3

