LABEL arch
TEXT HELP
Boot the NovaPlay OS on BIOS.
Live-System zum Testen und Installieren.
ENDTEXT
MENU LABEL NovaPlay OS (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G nvidia-drm.modeset=1 quiet splash %KERNEL_PARAMS%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the NovaPlay OS on BIOS with speakup screen reader.
Live-System zum Testen und Installieren with speech feedback.
ENDTEXT
MENU LABEL NovaPlay OS (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G nvidia-drm.modeset=1 accessibility=on %KERNEL_PARAMS%
